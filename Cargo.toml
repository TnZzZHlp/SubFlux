[package]
name = "subflux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A terminal UI tool that translates video subtitles or transcribes audio first"

[[bin]]
name = "subtitle-translator"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
crossterm = "0.29"
dotenvy = "0.15"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "charset", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
url = "2"
